<style>
/* 基础表格样式 */
.stream-control-table {
    border-collapse: separate;
    border-spacing: 0;
    width: 30%;
  }

  /* 视频容器 */
  .video-container {
    position: relative;
    margin: 0 auto;
  }

  .main-canvas {
    background: #000;
    display: block;
  }

  .overlay-canvas {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: transparent;
  }

  /* 控制栏样式 */
  .control-bar {
    background: #f5f5f5;
    padding: 8px 0;
  }

  .stream-info {
    padding-left: 20px;
  }

  .current-codec {
    margin-left: 20px;
    color: #666;
  }

  /* 按钮样式 */
  .control-btn {
    padding: 4px 12px;
    margin: 0 5px;
    background: #4a8cff;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
  }

  /* 参数表格样式 */
  .stream-params {
    width: 70%;
    border-top: 1px solid #eee;
    padding: 10px 0;
  }

  .stream-params td {
    padding: 5px 8px;
    white-space: nowrap;
  }

  .param-select {
    padding: 3px;
    min-width: 80px;
  }

  .bitrate-input {
    width: 80px;
    padding: 3px 5px;
  }

</style>
